<div
  class="book-modal"
  id="bookModal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="modalBookTitle"
  hidden
>
  <div class="book-modal__backdrop" data-modal-close></div>

  <div class="book-modal__dialog">
    <button
      type="button"
      class="book-modal__close"
      data-modal-close
      aria-label="Close modal"
    >
      <svg class="icon" width="20" height="20" aria-hidden="true">
        <use href="./img/sprite.svg#icon-close"></use>
      </svg>
    </button>

    <div class="book-modal__content">
      <div class="book-modal__media">
        <img id="modalBookCover" class="book-modal__cover" src="" alt="" />
      </div>

      <div class="book-modal__info">
        <div class="book-modal__header">
          <h2 id="modalBookTitle" class="book-modal__title"></h2>
          <p id="modalBookAuthor" class="book-modal__author"></p>
          <p id="modalBookPrice" class="book-modal__price"></p>
        </div>

        <form class="book-modal__form" id="bookOrderForm">
          <div class="book-modal__quantity">
            <button
              type="button"
              class="qty-btn"
              id="qtyDecrease"
              aria-label="Decrease quantity"
            >
              <svg class="icon" width="16" height="16" aria-hidden="true">
                <use href="./img/sprite.svg#icon-minus"></use>
              </svg>
            </button>
            <input
              type="number"
              id="qtyInput"
              name="quantity"
              class="qty-input"
              value="1"
              min="1"
              aria-label="Quantity"
            />
            <button
              type="button"
              class="qty-btn"
              id="qtyIncrease"
              aria-label="Increase quantity"
            >
              <svg class="icon" width="16" height="16" aria-hidden="true">
                <use href="./img/sprite.svg#icon-plus"></use>
              </svg>
            </button>
          </div>

          <div class="book-modal__actions">
            <button
              type="button"
              class="book-modal__btn book-modal__btn--primary"
              id="addToCartBtn"
            >
              Add To Cart
            </button>
            <button
              type="submit"
              class="book-modal__btn book-modal__btn--secondary"
              id="buyNowBtn"
            >
              Buy Now
            </button>
          </div>

          <p
            class="book-modal__status"
            id="modalStatusMessage"
            aria-live="polite"
          ></p>
        </form>

        <div class="accordion-container" id="bookAccordion">
          <div class="ac">
            <h3 class="ac-header">
              <button type="button" class="ac-trigger" id="triggerDetails">
                Details
              </button>
            </h3>
            <div class="ac-panel">
              <p class="ac-text" id="modalBookDetails"></p>
            </div>
          </div>

          <div class="ac">
            <h3 class="ac-header">
              <button type="button" class="ac-trigger" id="triggerShipping">
                Shipping
              </button>
            </h3>
            <div class="ac-panel">
              <p class="ac-text" id="modalBookShipping"></p>
            </div>
          </div>

          <div class="ac">
            <h3 class="ac-header">
              <button type="button" class="ac-trigger" id="triggerReturns">
                Returns
              </button>
            </h3>
            <div class="ac-panel">
              <p class="ac-text" id="modalBookReturns"></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
