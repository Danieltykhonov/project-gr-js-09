<header class="header">
  <div class="container header-container">
    <a href="./" class="logo" aria-label="Booksy home">
      <svg class="logo-icon" width="84" height="36">
        <use href="./img/sprite.svg#logo"></use>
      </svg>
    </a>

    <nav class="header-nav" aria-label="Main navigation">
      <ul class="nav-list">
        <li><a class="nav-link" href="#hero">Home</a></li>
        <li><a class="nav-link" href="#books">Books</a></li>
        <li><a class="nav-link" href="#feedbacks">Feedbacks</a></li>
        <li><a class="nav-link" href="#events">Events</a></li>
        <li><a class="nav-link" href="#location">Location</a></li>
      </ul>
    </nav>

    <button
      class="burger-btn"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
    >
      <svg class="icon" width="24" height="24">
        <use href="./img/sprite.svg#icon-burger"></use>
      </svg>
    </button>
  </div>

  <!-- Мобільне меню (Navbar) -->
  <div class="mobile-menu">
    <div class="container mobile-menu-header">
      <a href="./" class="logo" aria-label="Booksy home">
        <svg class="logo-icon" width="84" height="36">
          <use href="./img/sprite.svg#logo"></use>
        </svg>
      </a>

      <button class="menu-close-btn" type="button" aria-label="Close menu">
        <svg class="icon" width="24" height="24">
          <use href="./img/sprite.svg#icon-close"></use>
        </svg>
      </button>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <ul class="mobile-nav-list">
        <li><a class="mobile-nav-link" href="#hero">Home</a></li>
        <li><a class="mobile-nav-link" href="#books">Books</a></li>
        <li><a class="mobile-nav-link" href="#feedbacks">Feedbacks</a></li>
        <li><a class="mobile-nav-link" href="#events">Events</a></li>
        <li><a class="mobile-nav-link" href="#location">Location</a></li>
      </ul>
    </nav>
  </div>
</header>
