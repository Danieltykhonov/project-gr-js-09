<section class="hero" id="hero">
  <div class="container hero-container">
    <div class="swiper hero-swiper">
      <ul class="swiper-wrapper hero-list">
        <li class="swiper-slide hero-slide">
          <picture>
            <source
              media="(min-width: 1440px)"
              srcset="
                ./img/hero/hero-1-desk@1x.webp 1x,
                ./img/hero/hero-1-desk@2x.webp 2x
              "
              type="image/webp"
            />
            <source
              media="(min-width: 768px)"
              srcset="
                ./img/hero/hero-1-tab@1x.webp 1x,
                ./img/hero/hero-1-tab@2x.webp 2x
              "
              type="image/webp"
            />
            <img
              class="hero-slide-img"
              src="./img/hero/hero-1-mob@1x.webp"
              srcset="
                ./img/hero/hero-1-mob@1x.webp 1x,
                ./img/hero/hero-1-mob@2x.webp 2x
              "
              alt="Open book, a knitted blanket and a cup of tea on a wooden table"
              width="343"
              height="199"
            />
          </picture>
          <div class="hero-slide-content">
            <p class="hero-slide-title">
              <span class="hero-slide-line">Get 10% off</span>
              <span class="hero-slide-line">your first order</span>
            </p>
            <a class="hero-slide-link" href="#books">Shop Now!</a>
          </div>
        </li>
        <li class="swiper-slide hero-slide hero-slide--shade-40">
          <picture>
            <source
              media="(min-width: 1440px)"
              srcset="
                ./img/hero/hero-2-desk@1x.webp 1x,
                ./img/hero/hero-2-desk@2x.webp 2x
              "
              type="image/webp"
            />
            <source
              media="(min-width: 768px)"
              srcset="
                ./img/hero/hero-2-tab@1x.webp 1x,
                ./img/hero/hero-2-tab@2x.webp 2x
              "
              type="image/webp"
            />
            <img
              class="hero-slide-img"
              src="./img/hero/hero-2-mob@1x.webp"
              srcset="
                ./img/hero/hero-2-mob@1x.webp 1x,
                ./img/hero/hero-2-mob@2x.webp 2x
              "
              alt="Open book and reading glasses on a light table"
              width="343"
              height="199"
              loading="lazy"
            />
          </picture>
          <div class="hero-slide-content">
            <p class="hero-slide-title hero-slide-title--split">
              <span class="hero-slide-line">Save 15% on</span>
              <span class="hero-slide-line">some books</span>
            </p>
            <a class="hero-slide-link" href="#books">Shop Now!</a>
          </div>
        </li>
        <li class="swiper-slide hero-slide hero-slide--shade-20">
          <picture>
            <source
              media="(min-width: 1440px)"
              srcset="
                ./img/hero/hero-3-desk@1x.webp 1x,
                ./img/hero/hero-3-desk@2x.webp 2x
              "
              type="image/webp"
            />
            <source
              media="(min-width: 768px)"
              srcset="
                ./img/hero/hero-3-tab@1x.webp 1x,
                ./img/hero/hero-3-tab@2x.webp 2x
              "
              type="image/webp"
            />
            <img
              class="hero-slide-img"
              src="./img/hero/hero-3-mob@1x.webp"
              srcset="
                ./img/hero/hero-3-mob@1x.webp 1x,
                ./img/hero/hero-3-mob@2x.webp 2x
              "
              alt="Colorful books standing on a bookshelf"
              width="343"
              height="199"
              loading="lazy"
            />
          </picture>
          <div class="hero-slide-content">
            <p class="hero-slide-title hero-slide-title--split">
              <span class="hero-slide-line">Summer Sale!</span>
              <span class="hero-slide-line">Up to -40% discounts</span>
            </p>
            <a class="hero-slide-link" href="#books">Shop Now!</a>
          </div>
        </li>
        <li class="swiper-slide hero-slide hero-slide--shade-30">
          <picture>
            <source
              media="(min-width: 1440px)"
              srcset="
                ./img/hero/hero-4-desk@1x.webp 1x,
                ./img/hero/hero-4-desk@2x.webp 2x
              "
              type="image/webp"
            />
            <source
              media="(min-width: 768px)"
              srcset="
                ./img/hero/hero-4-tab@1x.webp 1x,
                ./img/hero/hero-4-tab@2x.webp 2x
              "
              type="image/webp"
            />
            <img
              class="hero-slide-img"
              src="./img/hero/hero-4-mob@1x.webp"
              srcset="
                ./img/hero/hero-4-mob@1x.webp 1x,
                ./img/hero/hero-4-mob@2x.webp 2x
              "
              alt="Open book with glasses next to a vase with dried flowers"
              width="343"
              height="199"
              loading="lazy"
            />
          </picture>
          <div class="hero-slide-content">
            <p class="hero-slide-title hero-slide-title--wide">
              <span class="hero-slide-line">Last chance to buy</span>
              <span class="hero-slide-line">our spring bestsellers</span>
            </p>
            <a class="hero-slide-link" href="#books">Shop Now!</a>
          </div>
        </li>
      </ul>
    </div>

    <div class="hero-bottom">
      <h1 class="hero-title">Discover Your Next Great Read Today!</h1>

      <div class="hero-nav">
        <button class="hero-nav-btn hero-nav-prev" type="button">
          <svg class="icon" width="24" height="24" aria-hidden="true">
            <use href="./img/sprite.svg#icon-arrow-left"></use>
          </svg>
          <span class="visually-hidden">Previous slide</span>
        </button>
        <button class="hero-nav-btn hero-nav-next" type="button">
          <svg class="icon" width="24" height="24" aria-hidden="true">
            <use href="./img/sprite.svg#icon-arrow-right"></use>
          </svg>
          <span class="visually-hidden">Next slide</span>
        </button>
      </div>
    </div>
  </div>
</section>
