<section class="section books" id="books" data-aos="fade-up">
  <div class="container books-container">
    <h2 class="visually-hidden">Trending books</h2>

    <div class="books-sidebar">
      <h3 class="books-subtitle">Books</h3>

      <p class="books-count">
        Showing <span class="books-count-shown">0</span> of
        <span class="books-count-total">0</span>
      </p>

      <div class="books-filter">
        <button
          class="books-filter-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="books-categories"
        >
          <span class="books-filter-label">Categories</span>
          <svg
            class="icon books-filter-icon"
            width="24"
            height="24"
            aria-hidden="true"
          >
            <use href="./img/sprite.svg#icon-chevron-down"></use>
          </svg>
        </button>

        <ul class="books-categories" id="books-categories">
          <!-- категорії додає JS -->
        </ul>
      </div>
    </div>

    <div class="books-main">
      <ul class="books-list">
        <!-- картки книг додає JS -->
      </ul>

      <button class="books-more-btn is-hidden" type="button">Show More</button>
    </div>
  </div>
</section>
