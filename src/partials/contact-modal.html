<div class="contact-backdrop">
  <div
    class="contact-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="contact-modal-title"
  >
    <button
      class="contact-modal-close-btn"
      type="button"
      aria-label="Close modal window"
    >
      <svg
        class="icon contact-modal-close-icon"
        width="24"
        height="24"
        aria-hidden="true"
      >
        <use href="./img/sprite.svg#icon-close"></use>
      </svg>
    </button>

    <h2 class="section-title contact-modal-title" id="contact-modal-title">
      Register
    </h2>
    <p class="contact-modal-subtitle"></p>

    <form class="contact-modal-form" autocomplete="on" novalidate>
      <div class="contact-modal-field">
        <label class="contact-modal-label" for="user-name">Name*</label>
        <input
          class="contact-modal-input"
          type="text"
          id="user-name"
          name="user_name"
          placeholder="Ann"
          minlength="3"
          required
        />
      </div>

      <div class="contact-modal-field">
        <label class="contact-modal-label" for="user-email">Email*</label>
        <input
          class="contact-modal-input"
          type="email"
          id="user-email"
          name="user_email"
          placeholder="hello@booksy.com"
          pattern="^\w+(\.\w+)?@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$"
          required
        />
      </div>

      <div class="contact-modal-field contact-modal-field-textarea">
        <label class="contact-modal-label" for="user-message">Message</label>
        <textarea
          class="contact-modal-textarea"
          id="user-message"
          name="user_message"
          placeholder="Type your message..."
        ></textarea>
      </div>

      <button class="contact-modal-submit-btn" type="submit">Register</button>
    </form>
  </div>
</div>
